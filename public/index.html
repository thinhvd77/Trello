<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern Kanban-style project and task management application">
    <meta name="theme-color" content="#4F46E5">
    <title>Trello Clone - Project Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=1.3">
</head>

<body>
    <!-- Skip Navigation Link -->
    <a href="#board" class="skip-link">Skip to main content</a>

    <div class="app-container">
        <!-- Sidebar Overlay for Mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Project navigation">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="9" rx="1" />
                        <rect x="14" y="3" width="7" height="5" rx="1" />
                        <rect x="14" y="12" width="7" height="9" rx="1" />
                        <rect x="3" y="16" width="7" height="5" rx="1" />
                    </svg>
                    <span>TaskFlow</span>
                </div>
                <button class="btn-icon sidebar-close-btn" id="sidebarCloseBtn" title="Close"
                    aria-label="Close sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <div class="sidebar-section">
                <div class="section-header">
                    <span>Projects</span>
                    <button class="btn-icon" id="addProjectBtn" title="Add Project" aria-label="Add new project">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" aria-hidden="true">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                    </button>
                </div>
                <ul class="project-list" id="projectList">
                    <!-- Projects will be loaded here -->
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" role="main">
            <!-- Board Header -->
            <header class="board-header">
                <div class="board-title-container">
                    <button class="btn-icon mobile-menu-btn" id="mobileMenuBtn" title="Menu" aria-label="Open menu"
                        aria-expanded="false">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" aria-hidden="true">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <h1 class="board-title" id="boardTitle">Select a Project</h1>
                    <button class="btn-icon edit-title-btn" id="editProjectBtn" title="Edit Project"
                        style="display: none;" aria-label="Edit project">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" aria-hidden="true">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                        </svg>
                    </button>
                </div>
                <div class="board-actions">
                    <button class="btn btn-danger" id="deleteProjectBtn" style="display: none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                        <span class="btn-text">Delete</span>
                    </button>
                </div>
            </header>

            <!-- Board -->
            <div class="board" id="board" tabindex="-1">
                <div class="board-empty" id="boardEmpty" role="status" aria-live="polite">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        aria-hidden="true">
                        <rect x="3" y="3" width="7" height="9" rx="1" />
                        <rect x="14" y="3" width="7" height="5" rx="1" />
                        <rect x="14" y="12" width="7" height="9" rx="1" />
                        <rect x="3" y="16" width="7" height="5" rx="1" />
                    </svg>
                    <h2>Welcome to TaskFlow</h2>
                    <p>Select a project from the sidebar or create a new one to get started</p>
                </div>
                <div class="lists-container" id="listsContainer">
                    <!-- Lists will be loaded here -->
                </div>
                <div class="add-list-container" id="addListContainer" style="display: none;">
                    <button class="add-list-btn" id="addListBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                        Add another list
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Task Modal -->
    <div class="modal-overlay" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Task Details</h2>
                <button class="btn-icon modal-close" id="closeModal" aria-label="Close dialog">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" class="form-input" placeholder="Enter task title...">
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" class="form-textarea"
                        placeholder="Add a more detailed description..." rows="4"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelTaskBtn">Cancel</button>
                <button class="btn btn-primary" id="saveTaskBtn">Save Task</button>
            </div>
        </div>
    </div>

    <!-- Project Modal -->
    <div class="modal-overlay" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2 id="projectModalTitle">New Project</h2>
                <button class="btn-icon modal-close" id="closeProjectModal" aria-label="Close dialog">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" class="form-input" placeholder="Enter project name...">
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <div class="color-picker" id="colorPicker">
                        <button class="color-option selected" data-color="#6366f1"
                            style="background: #6366f1;"></button>
                        <button class="color-option" data-color="#8b5cf6" style="background: #8b5cf6;"></button>
                        <button class="color-option" data-color="#ec4899" style="background: #ec4899;"></button>
                        <button class="color-option" data-color="#f43f5e" style="background: #f43f5e;"></button>
                        <button class="color-option" data-color="#f97316" style="background: #f97316;"></button>
                        <button class="color-option" data-color="#eab308" style="background: #eab308;"></button>
                        <button class="color-option" data-color="#22c55e" style="background: #22c55e;"></button>
                        <button class="color-option" data-color="#14b8a6" style="background: #14b8a6;"></button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelProjectBtn">Cancel</button>
                <button class="btn btn-primary" id="saveProjectBtn">Create Project</button>
            </div>
        </div>
    </div>

    <!-- List Name Modal -->
    <div class="modal-overlay" id="listModal" role="dialog" aria-modal="true" aria-labelledby="listModalTitle">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2 id="listModalTitle">New List</h2>
                <button class="btn-icon modal-close" id="closeListModal" aria-label="Close dialog">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="listName">List Name</label>
                    <input type="text" id="listName" class="form-input" placeholder="Enter list name...">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelListBtn">Cancel</button>
                <button class="btn btn-primary" id="saveListBtn">Create List</button>
            </div>
        </div>
    </div>

    <!-- Move To Modal -->
    <div class="modal-overlay" id="moveToModal" role="dialog" aria-modal="true" aria-labelledby="moveToModalTitle">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2 id="moveToModalTitle">Move to...</h2>
                <button class="btn-icon modal-close" id="closeMoveToModal" aria-label="Close dialog">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="move-to-list" id="moveToListContainer">
                    <!-- Lists will be rendered dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/mobile-card-move.js"></script>
</body>

</html>
